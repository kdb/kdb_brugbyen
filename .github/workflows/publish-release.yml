name: Publish release
on:
  push:
    tags:
      - "*"
jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set module version
        # Drupal shows the "version" key from the info file on the module
        # list page. The key is set (or replaced, if already present) from the
        # tag name, so the released archive identifies itself the same way a
        # drupal.org packaged module does.
        run: |
          if grep -qE '^version:' kdb_brugbyen.info.yml; then
            sed -i -E "s/^version:.*/version: '${GITHUB_REF_NAME}'/" kdb_brugbyen.info.yml
          else
            printf "version: '%s'\n" "${GITHUB_REF_NAME}" >> kdb_brugbyen.info.yml
          fi
          # Echo for debugging
          cat kdb_brugbyen.info.yml
      - name: Create archive
        run: |
          git archive --format=zip --prefix=kdb_brugbyen/ HEAD -o kdb_brugbyen.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: kdb_brugbyen.zip
